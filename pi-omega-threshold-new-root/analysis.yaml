likelihoods:
  - name: EXP-Belle-timelike #up to 1.1 GeV
    constraints:
      - '0->pipi::Abs{f_+}^2@Belle:2008C;end=21'

  - name: EXP-CLEO-timelike #up to 1.1 GeV
    constraints:
      - '0->pipi::Abs{f_+}^2@CLEO:2000B;end=30'

  - name: EXP-NA7-spacelike
    constraints:
      - '0->pipi::Abs{f_+}^2@NA7:1986A'
  - name: EXP-JLAB # From arXiv:0809.3052, table I, converted from f_pi to |f_pi|^2

    manual_constraints:
      "0->pipi::Abs{f_+}^2@JLAB":
        type: "Gaussian"
        observable: "0->pipi::Abs{f_+}^2(q2);I=1"
        kinematics: {'q2': -2.45}
        options: {'form-factors': 'BHKMNR2026'}
        mean: 0.027889
        sigma-stat: {"hi": 0.0033, "lo": 0.0033}
        sigma-sys:  {"hi": 0.0043, "lo": 0.0023}

  - name: root-penalty
    manual_constraints:
      "0->pipi::root_penalty":
        type: "UniformBound"
        observables: ["0->pipi::root_penalty@BHKMNR2026"]
        options: [{}]
        kinematics: [{}]
        bound: 1.0
        uncertainty: 0.01

